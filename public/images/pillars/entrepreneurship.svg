<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bg-ent" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090F1D" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="glow-ent" cx="72%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bar-1" x1="0" y1="260" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bar-2" x1="0" y1="210" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bar-3" x1="0" y1="155" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="bar-4" x1="0" y1="95" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <pattern id="grid-ent" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg-ent)" />
  <rect width="640" height="400" fill="url(#grid-ent)" opacity="0.65" />
  <rect width="640" height="400" fill="url(#glow-ent)" />

  <!-- Baseline Architectural Horizon -->
  <line x1="76" y1="330" x2="564" y2="330" stroke="#334155" stroke-width="1.5" />
  <line x1="76" y1="270" x2="564" y2="270" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="76" y1="210" x2="564" y2="210" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="76" y1="150" x2="564" y2="150" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Ascending Venture Studio Pillars (Shape -> Validate -> Build -> Scale) -->
  <rect x="116" y="256" width="68" height="74" rx="4" fill="url(#bar-1)" stroke="#3B82F6" stroke-width="1.2" />
  <rect x="224" y="206" width="68" height="124" rx="4" fill="url(#bar-2)" stroke="#60A5FA" stroke-width="1.2" />
  <rect x="332" y="152" width="68" height="178" rx="4" fill="url(#bar-3)" stroke="#7DD3FC" stroke-width="1.4" />
  <rect x="440" y="96" width="68" height="234" rx="4" fill="url(#bar-4)" stroke="#BAE6FD" stroke-width="1.6" />

  <!-- Trajectory Curve & Validation Checkpoints -->
  <path d="M 150 236 C 210 220, 290 165, 474 72" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="150" cy="236" r="5" fill="#0F172A" stroke="#60A5FA" stroke-width="2.5" />
  <circle cx="258" cy="186" r="5" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
  <circle cx="366" cy="130" r="5.5" fill="#0F172A" stroke="#7DD3FC" stroke-width="2.5" />
  <circle cx="474" cy="72" r="6.5" fill="#38BDF8" stroke="#E0F2FE" stroke-width="2.5" />

  <!-- Technical Frame Marks -->
  <path d="M 28 44 L 28 28 L 44 28" stroke="#475569" stroke-width="1.5" />
  <path d="M 612 44 L 612 28 L 596 28" stroke="#475569" stroke-width="1.5" />
  <path d="M 28 356 L 28 372 L 44 372" stroke="#475569" stroke-width="1.5" />
  <path d="M 612 356 L 612 372 L 596 372" stroke="#475569" stroke-width="1.5" />
