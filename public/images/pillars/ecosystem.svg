<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none">
  <defs>
    <linearGradient id="bg-eco" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090F1D" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <radialGradient id="glow-eco" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-eco" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg-eco)" />
  <rect width="640" height="400" fill="url(#grid-eco)" opacity="0.65" />
  <rect width="640" height="400" fill="url(#glow-eco)" />

  <!-- Ecosystem Orbital Rings -->
  <ellipse cx="320" cy="200" rx="210" ry="118" stroke="#1E3A8A" stroke-width="1.2" />
  <ellipse cx="320" cy="200" rx="140" ry="78" stroke="#334155" stroke-width="1" stroke-dasharray="5 5" />

  <!-- Network Interconnect Edges -->
  <line x1="320" y1="200" x2="176" y2="118" stroke="#38BDF8" stroke-width="1.6" />
  <line x1="320" y1="200" x2="468" y2="116" stroke="#38BDF8" stroke-width="1.6" />
  <line x1="320" y1="200" x2="152" y2="262" stroke="#60A5FA" stroke-width="1.6" />
  <line x1="320" y1="200" x2="488" y2="264" stroke="#60A5FA" stroke-width="1.6" />
  <line x1="320" y1="200" x2="320" y2="82" stroke="#818CF8" stroke-width="1.4" />
  <line x1="320" y1="200" x2="320" y2="318" stroke="#818CF8" stroke-width="1.4" />

  <line x1="176" y1="118" x2="320" y2="82" stroke="#334155" stroke-width="1.2" />
  <line x1="320" y1="82" x2="468" y2="116" stroke="#334155" stroke-width="1.2" />
  <line x1="468" y1="116" x2="488" y2="264" stroke="#334155" stroke-width="1.2" />
  <line x1="488" y1="264" x2="320" y2="318" stroke="#334155" stroke-width="1.2" />
  <line x1="320" y1="318" x2="152" y2="262" stroke="#334155" stroke-width="1.2" />
  <line x1="152" y1="262" x2="176" y2="118" stroke="#334155" stroke-width="1.2" />

  <!-- Outer Partner & Founder Nodes -->
  <circle cx="176" cy="118" r="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2.2" />
  <circle cx="176" cy="118" r="4" fill="#38BDF8" />

  <circle cx="468" cy="116" r="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2.2" />
  <circle cx="468" cy="116" r="4" fill="#38BDF8" />

  <circle cx="152" cy="262" r="12" fill="#0F172A" stroke="#60A5FA" stroke-width="2.2" />
  <circle cx="152" cy="262" r="4" fill="#60A5FA" />

  <circle cx="488" cy="264" r="12" fill="#0F172A" stroke="#60A5FA" stroke-width="2.2" />
  <circle cx="488" cy="264" r="4" fill="#60A5FA" />

  <circle cx="320" cy="82" r="10" fill="#0F172A" stroke="#818CF8" stroke-width="2" />
  <circle cx="320" cy="82" r="3.5" fill="#818CF8" />

  <circle cx="320" cy="318" r="10" fill="#0F172A" stroke="#818CF8" stroke-width="2" />
  <circle cx="320" cy="318" r="3.5" fill="#818CF8" />

  <!-- Central MOXFORGE Ecosystem Hub -->
  <circle cx="320" cy="200" r="28" fill="#0F172A" stroke="#7DD3FC" stroke-width="2.5" />
  <circle cx="320" cy="200" r="18" fill="#1D4ED8" fill-opacity="0.45" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="320" cy="200" r="6" fill="#E0F2FE" />

  <!-- Technical Frame Marks -->
  <path d="M 28 44 L 28 28 L 44 28" stroke="#475569" stroke-width="1.5" />
  <path d="M 612 44 L 612 28 L 596 28" stroke="#475569" stroke-width="1.5" />
  <path d="M 28 356 L 28 372 L 44 372" stroke="#475569" stroke-width="1.5" />
  <path d="M 612 356 L 612 372 L 596 372" stroke="#475569" stroke-width="1.5" />
</svg>
